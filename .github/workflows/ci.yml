name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Offline tests
        env:
          # GitHub's Ubuntu image forbids Chrome's own sandbox for unprivileged users;
          # the tests only open the bundled 127.0.0.1 site.
          WW_SCRAPER_CHROME_ARGS: --no-sandbox
        run: pytest -q
