<g data-id="content" data-typ="usluga"><rect class="wz" x="40" y="116" width="168" height="72" rx="8"/>
<text class="n" x="124" y="144" text-anchor="middle">Content actors</text>
<text class="p" x="124" y="178" text-anchor="middle">pages, feeds, data, media</text></g>
