<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 248" width="992" height="248" role="img" aria-labelledby="t d">
<title id="t">From a file to a run</title><desc id="d">The init command writes an actor file. The run command loads the file, checks that it defines exactly one actor with a valid name and schema, and runs it with the standard run context.</desc>
<style>:root{--tlo:#050507;--tekst:#FDFFF5;--linia:#A8A8B0;--strefa:#A8A8B0;--wezel:#14141C;--wezel-tekst:#FDFFF5;--akcent:#8C8CF0;}text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:var(--tekst)}.n{font-size:13px;font-weight:600;fill:var(--wezel-tekst)}.p{font-size:11px;fill:var(--wezel-tekst)}.s{font-size:12px;fill:var(--strefa)}.tt{font-size:16px;font-weight:700}.wz{fill:var(--wezel);stroke:var(--linia);stroke-width:1.5}.bram{stroke:var(--akcent);stroke-width:3}.mod{stroke-dasharray:0}.st{fill:none;stroke:var(--strefa);stroke-width:1.5;stroke-dasharray:6 4}.kr{stroke:var(--linia);stroke-width:1.5;fill:none}.gr{stroke:var(--akcent);stroke-width:2.5}.gt{fill:var(--akcent)}</style>
<rect width="992" height="248" fill="#050507"/>
<text class="tt" x="40" y="32">From a file to a run</text>
<g><rect class="st" x="16" y="72" width="216" height="160" rx="6"/><text class="s" x="26" y="88">Your code</text></g>
<g><rect class="st" x="264" y="72" width="712" height="160" rx="6"/><text class="s" x="274" y="88">ww-scraper</text></g>
<path class="kr" d="M208 152H280"/><path class="gt" d="M288 152l-9 -5v10z"/>
<path class="gr" d="M248 102V202"/>
<path class="kr" d="M456 152H528"/><path class="gt" d="M536 152l-9 -5v10z"/>
<path class="kr" d="M704 152H776"/><path class="gt" d="M784 152l-9 -5v10z"/>
<g data-id="file" data-typ="klient"><rect class="wz" x="40" y="116" width="168" height="72" rx="8"/>
<text class="n" x="124" y="144" text-anchor="middle">Actor file</text>
<text class="p" x="124" y="178" text-anchor="middle">written by init, edited</text></g>
<g data-id="load" data-typ="bramka"><rect class="wz bram" x="288" y="116" width="168" height="72" rx="8"/>
<text class="n" x="372" y="144" text-anchor="middle">Load and check</text>
<text class="p" x="372" y="178" text-anchor="middle">one Actor, name, schema</text></g>
<g data-id="ctx" data-typ="usluga"><rect class="wz" x="536" y="116" width="168" height="72" rx="8"/>
<text class="n" x="620" y="144" text-anchor="middle">RunContext</text>
<text class="p" x="620" y="178" text-anchor="middle">same gates as built-ins</text></g>
<g data-id="out" data-typ="usluga"><rect class="wz" x="784" y="116" width="168" height="72" rx="8"/>
<text class="n" x="868" y="144" text-anchor="middle">Dataset and report</text>
<text class="p" x="868" y="178" text-anchor="middle">items, HTML report</text></g>
</svg>
